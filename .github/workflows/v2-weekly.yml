name: v2 weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz for one minute
        run: |
          cargo +nightly fuzz run ecb_xml -- -max_total_time=60
          cargo +nightly fuzz run vies_soap -- -max_total_time=60
          cargo +nightly fuzz run query -- -max_total_time=60

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the embedded ECB snapshot
        run: python3 tools/refresh_snapshot.py
      - name: Open a pull request when the snapshot changes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-rates-snapshot
          commit-message: "Refresh embedded ECB rates snapshot"
          title: "Refresh embedded ECB rates snapshot"
          body: |
            Weekly refresh of the embedded ECB history snapshot and the pyfloat oracle.
            VAT rate JSON is updated by a separate data pull request.
          add-paths: |
            data/rates-snapshot.json.gz
            tests/fixtures/pyfloat_oracle.json
