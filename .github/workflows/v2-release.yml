name: v2 release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-dist 0.33.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
      - name: Build release artifacts
        working-directory: v2
        run: dist build
      - name: Attest artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "v2/target/distrib/**/*"
      - name: Publish the GitHub release
        working-directory: v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dist host

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: v2
          file: v2/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/madisvain/vatcomply:${{ github.ref_name }}
            ghcr.io/madisvain/vatcomply:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
