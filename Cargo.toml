[package]
name = "vatcomply"
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "VAT validation, ECB exchange rates, and IP geolocation API"
repository = "https://github.com/madisvain/vatcomply"
publish = false
default-run = "vatcomply"

[workspace]
members = ["."]
exclude = ["fuzz"]

[dependencies]
arc-swap = "1"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
flate2 = "1"
iban_validation_rs = { version = "0.1.30", features = ["non_registry"] }
indexmap = { version = "2", features = ["serde"] }
iso-rs = { version = "0.2.0", default-features = false, features = ["from_alpha_2"] }
maxminddb = "0.27"
mimalloc = "0.1"
moka = { version = "0.12", features = ["future"] }
# `currency_code_kpw` and `currency_code_lak` are required. 0.1.21 drops those
# variants unless the feature is enabled, while KP and LA still name them.
my_country = { version = "0.1.21", default-features = false, features = ["all_countries", "iterator", "alpha2", "alpha3", "numeric_code", "iso_short_name", "country_code", "currency_code", "currency_code_kpw", "currency_code_lak", "region", "subregion", "geo", "emoji_flag"] }
prometheus = "0.14"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip"] }
rust_decimal = "1"
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls", "tracing", "tower-axum-matched-path", "test"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
strum = { version = "0.28", default-features = false }
tld = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "timeout", "trace", "catch-panic"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["macros", "axum_extras"] }
utoipa-axum = "0.2"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
